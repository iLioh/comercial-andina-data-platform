AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Fargate runtime for the Comercial Andina Prefect worker.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  WorkerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ContainerImage:
    Type: String
  DataLakeBucket:
    Type: String
  KmsKeyArn:
    Type: String
  RdsEndpoint:
    Type: String
  RdsSecretArn:
    Type: String
  RedshiftWorkgroup:
    Type: String
  RedshiftSecretArn:
    Type: String
  PrefectApiUrl:
    Type: String
  PrefectApiKeySecretArn:
    Type: String

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub comercial-andina-${Environment}
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/comercial-andina/${Environment}/prefect-worker
      RetentionInDays: 30

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: InjectPrefectSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref PrefectApiKeySecretArn
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref KmsKeyArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DataPipelineRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${DataLakeBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${DataLakeBucket}/*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref RdsSecretArn, !Ref RedshiftSecretArn]
              - Effect: Allow
                Action:
                  - redshift-data:ExecuteStatement
                  - redshift-data:DescribeStatement
                  - redshift-data:CancelStatement
                  - redshift-data:GetStatementResult
                Resource: "*"
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
                Resource: !Ref KmsKeyArn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub comercial-andina-${Environment}-prefect-worker
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: prefect-worker
          Image: !Ref ContainerImage
          Essential: true
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: CA_RAW_BUCKET
              Value: !Ref DataLakeBucket
            - Name: CA_RDS_HOST
              Value: !Ref RdsEndpoint
            - Name: CA_RDS_DATABASE
              Value: comercial_andina
            - Name: CA_RDS_SECRET_ARN
              Value: !Ref RdsSecretArn
            - Name: CA_REDSHIFT_WORKGROUP
              Value: !Ref RedshiftWorkgroup
            - Name: CA_REDSHIFT_DATABASE
              Value: comercial_andina_dw
            - Name: CA_REDSHIFT_SECRET_ARN
              Value: !Ref RedshiftSecretArn
            - Name: PREFECT_API_URL
              Value: !Ref PrefectApiUrl
          Secrets:
            - Name: PREFECT_API_KEY
              ValueFrom: !Ref PrefectApiKeySecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker
          HealthCheck:
            Command: [CMD-SHELL, "python -c 'import prefect' || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub comercial-andina-${Environment}-prefect-worker
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      LaunchType: FARGATE
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref WorkerSecurityGroupId]
          Subnets: !Ref PrivateSubnetIds

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt WorkerService.Name
