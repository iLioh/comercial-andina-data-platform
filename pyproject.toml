[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "comercial-andina-data-platform"
version = "0.1.0"
description = "Plataforma analítica de ventas de Comercial Andina S.A."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
azure = [
    "azure-identity>=1.24",
    "azure-keyvault-secrets>=4.10",
    "azure-storage-blob>=12.26",
    "pyodbc>=5.2",
    "psycopg[binary]>=3.2",
]
orchestration = [
    "prefect>=3.4",
]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "PyYAML>=6",
]

[project.scripts]
comercial-andina = "comercial_andina.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
